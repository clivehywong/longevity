[pytest]
# Pytest configuration for neuroimaging pipeline tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_nifti: marks tests requiring nibabel
    requires_pandas: marks tests requiring pandas
    smoke: marks tests as smoke tests (quick validation)

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Timeout for tests (seconds)
timeout = 300

# Minimum Python version
minversion = 7.0

# Logging
log_cli = false
log_cli_level = INFO
